<form #formularz="ngForm" (ngSubmit)="onSubmit(formularz)">
    <div>
        <label for="name">Imię: </label>
        <input required minlength="3" type="text" name="name" id="name" 
            [(ngModel)]="name" (ngModelChange)="onNameChange($event)" />
    </div>

    <div>
        <label for="surname">Nazwisko: </label>
        <input required="" minlength="5" type="text" name="surname" id="surname" [(ngModel)]="surname" />
    </div>

    <div>
        <label for="dateOfBirth">Imię: </label>
        <input required type="date" name="dateOfBirth" id="dateOfBirth" [(ngModel)]="dateOfBirth" />
    </div>

    <!-- <button type="button">Test</button>
    <input type="button" value="Test 2" /> -->
    <input [disabled]="!formularz.valid" type="submit" value="Zapisz" />
</form>

<div class="licznik">
    <div>
        Imię: {{name}}
    </div>
    <div>
        Nazwisko: {{surname}}
    </div>
    <div>
        Data urodzenia: {{dateOfBirth}}
    </div>
    <div>
        <button (click)="ustawDomyslneWartosci()">Reset</button>
    </div>
</div>
